<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 970" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .header { fill: #161b22; }
      .border { stroke: #30363d; stroke-width: 1px; fill: none; }
      .btn-red { fill: #ff5f56; }
      .btn-yellow { fill: #ffbd2e; }
      .btn-green { fill: #27c93f; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; }
      .term { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #c9d1d9; }
      .bold { font-weight: 700; }
      .dim { fill: #8b949e; }
      .green { fill: #3fb950; font-weight: 700; }
      .blue { fill: #58a6ff; font-weight: 700; }
      .yellow { fill: #d29922; }
      .yellow-bold { fill: #d29922; font-weight: 700; }
      .cyan { fill: #39c5cf; }
      .cyan-bold { fill: #39c5cf; font-weight: 700; }
      .red-bold { fill: #f85149; font-weight: 700; }
      .white { fill: #f0f6fc; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="970" rx="10" ry="10" class="bg"/>
  <rect width="880" height="38" rx="10" ry="10" class="header"/>
  <rect y="28" width="880" height="10" class="header"/>
  <line x1="0" y1="38" x2="880" y2="38" stroke="#30363d" stroke-width="1"/>
  <rect width="880" height="970" rx="10" ry="10" class="border"/>

  <!-- Window controls -->
  <circle cx="20" cy="19" r="6" class="btn-red"/>
  <circle cx="40" cy="19" r="6" class="btn-yellow"/>
  <circle cx="60" cy="19" r="6" class="btn-green"/>
  <text x="440" y="23" text-anchor="middle" class="title">procwhy — terminal</text>

  <!-- Terminal content -->
  <g transform="translate(25, 68)" class="term">
    <!-- Prompt -->
    <text y="0"><tspan class="dim">$</tspan> <tspan class="bold white">procwhy</tspan> <tspan class="green">545719</tspan></text>

    <!-- Header -->
    <text y="36"><tspan class="bold white">PID</tspan> <tspan class="white">545719</tspan>  <tspan class="green">firefox</tspan></text>

    <!-- VERDICT -->
    <text y="72" class="blue">VERDICT</text>
    <text y="94"><tspan class="yellow-bold">  WARN:</tspan> [<tspan class="yellow">DELETED FILES</tspan>] <tspan class="white">5 open file handles point to deleted files (e.g. /home/user/.cache/app.log (deleted)).</tspan></text>
    <text y="114" class="dim">    Hint: Restart the process to release deleted file handles and free disk space.</text>
    <text y="136"><tspan class="yellow-bold">  WARN:</tspan> [<tspan class="yellow">HIGH CHILD COUNT</tspan>] <tspan class="white">Process (PID 545719) has spawned 127 child processes.</tspan></text>
    <text y="156" class="dim">    Hint: Ensure child processes are reaped to avoid process table exhaustion.</text>
    <text y="178"><tspan class="cyan-bold">  INFO:</tspan> [<tspan class="cyan">HIGH FD COUNT</tspan>] <tspan class="white">Process has 115 open file descriptors and sockets.</tspan></text>

    <!-- STATS -->
    <text y="214" class="blue">STATS</text>
    <text y="236">  CPU        <tspan class="white">0.0%</tspan></text>
    <text y="256">  Memory     <tspan class="white">1236.3 MB</tspan> <tspan class="dim">(5.3% of 23.0 GB)</tspan></text>
    <text y="276">  Disk I/O   <tspan class="white">0 B/s</tspan></text>
    <text y="296">  Status     <tspan class="white">Sleep</tspan></text>
    <text y="316">  Wait Chan  <tspan class="dim">poll_schedule_timeout.constprop.0</tspan></text>

    <!-- ENVIRONMENT -->
    <text y="352" class="blue">ENVIRONMENT (Top 5)</text>
    <text y="374" class="dim">  PATH=/usr/local/bin:/usr/bin:...</text>
    <text y="394" class="dim">  ...and 45 more</text>

    <!-- CHILDREN -->
    <text y="430" class="blue">CHILDREN (Top 5)</text>
    <text y="452">  └─ <tspan class="dim">Socket Thread</tspan> <tspan class="bold white">545741</tspan></text>
    <text y="472">  └─ <tspan class="dim">Compositor</tspan> <tspan class="bold white">545794</tspan></text>
    <text y="492">  └─ <tspan class="dim">Renderer</tspan> <tspan class="bold white">545780</tspan></text>
    <text y="512">  └─ <tspan class="dim">TaskController</tspan> <tspan class="bold white">545763</tspan></text>
    <text y="532">  └─ <tspan class="dim">IPC I/O Parent</tspan> <tspan class="bold white">545738</tspan></text>
    <text y="552" class="dim">  ...and 122 more</text>

    <!-- NETWORK -->
    <text y="588" class="blue">NETWORK</text>
    <text y="610">  → <tspan class="yellow">TCP 192.168.1.83:53736 -> 34.107.243.93:443 (ESTABLISHED)</tspan></text>
    <text y="630">  → <tspan class="yellow">TCP [2a0d:3341:...]:43816 -> [2606:4700:...]:443 (ESTABLISHED)</tspan></text>
    <text y="650">  → <tspan class="yellow">UDP [::]:43319</tspan></text>

    <!-- UNIX SOCKETS -->
    <text y="686" class="blue">UNIX SOCKETS (Top 5)</text>
    <text y="708">  → <tspan class="cyan">/run/user/1000/wayland-proxy-545719</tspan></text>
    <text y="728">  → <tspan class="cyan">[socket: 829325]</tspan></text>
    <text y="748">  → <tspan class="cyan">[unnamed SEQPACKET socket (inode 1004626)]</tspan></text>
    <text y="768">  → <tspan class="cyan">[unnamed SEQPACKET socket (inode 1056766)]</tspan></text>
    <text y="788" class="dim">  ...and 42 more</text>

    <!-- FILES -->
    <text y="824" class="blue">FILES (Top 5)</text>
    <text y="846">  /dev/dri/renderD128</text>
    <text y="866">  /dev/null</text>
    <text y="886">  /dev/tty1</text>
    <text y="906" class="dim">  ...and 57 more</text>
  </g>
</svg>
