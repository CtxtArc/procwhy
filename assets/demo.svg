<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 980" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .border { stroke: #30363d; stroke-width: 1px; fill: none; }
      .term { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #c9d1d9; }
      .bold { font-weight: 700; }
      .dim { fill: #8b949e; }
      .green { fill: #3fb950; font-weight: 700; }
      .blue { fill: #58a6ff; font-weight: 700; }
      .yellow { fill: #d29922; }
      .yellow-bold { fill: #d29922; font-weight: 700; }
      .cyan { fill: #39c5cf; }
      .cyan-bold { fill: #39c5cf; font-weight: 700; }
      .white { fill: #f0f6fc; }
    </style>
  </defs>

  <!-- Clean dark background with subtle border -->
  <rect width="880" height="980" rx="8" ry="8" class="bg"/>
  <rect width="880" height="980" rx="8" ry="8" class="border"/>

  <!-- Terminal content -->
  <g transform="translate(25, 30)" class="term">
    <!-- Prompt -->
    <text y="0"><tspan class="dim">$</tspan> <tspan class="bold white">procwhy</tspan> <tspan class="green">545719</tspan></text>

    <!-- Header -->
    <text y="34"><tspan class="bold white">PID</tspan> <tspan class="white">545719</tspan>  <tspan class="green">firefox</tspan></text>

    <!-- VERDICT -->
    <text y="70" class="blue">VERDICT</text>
    <text y="92"><tspan class="yellow-bold">  WARN:</tspan> [<tspan class="yellow">DELETED FILES</tspan>] <tspan class="white">5 open file handles point to deleted files (e.g. /home/user/.cache/app.log (deleted)).</tspan></text>
    <text y="112" class="dim">    Hint: Restart the process to release deleted file handles and free disk space.</text>
    <text y="134"><tspan class="yellow-bold">  WARN:</tspan> [<tspan class="yellow">HIGH CHILD COUNT</tspan>] <tspan class="white">Process (PID 545719) has spawned 127 child processes.</tspan></text>
    <text y="154" class="dim">    Hint: Ensure child processes are reaped to avoid process table exhaustion.</text>
    <text y="176"><tspan class="cyan-bold">  INFO:</tspan> [<tspan class="cyan">HIGH FD COUNT</tspan>] <tspan class="white">Process has 115 open file descriptors and sockets.</tspan></text>

    <!-- STATS -->
    <text y="212" class="blue">STATS</text>
    <text y="234">  CPU        <tspan class="white">0.0%</tspan></text>
    <text y="254">  Memory     <tspan class="white">1236.3 MB</tspan> <tspan class="dim">(5.3% of 23.0 GB)</tspan></text>
    <text y="274">  Disk I/O   <tspan class="white">0 B/s</tspan></text>
    <text y="294">  Status     <tspan class="white">Sleep</tspan></text>
    <text y="314">  Wait Chan  <tspan class="dim">poll_schedule_timeout.constprop.0</tspan></text>

    <!-- ENVIRONMENT -->
    <text y="350" class="blue">ENVIRONMENT (Top 5)</text>
    <text y="372" class="dim">  PATH=/usr/local/bin:/usr/bin:...</text>
    <text y="392" class="dim">  ...and 45 more</text>

    <!-- CHILDREN -->
    <text y="428" class="blue">CHILDREN (Top 5)</text>
    <text y="450">  └─ <tspan class="dim">Socket Thread</tspan> <tspan class="bold white">545741</tspan></text>
    <text y="470">  └─ <tspan class="dim">Compositor</tspan> <tspan class="bold white">545794</tspan></text>
    <text y="490">  └─ <tspan class="dim">Renderer</tspan> <tspan class="bold white">545780</tspan></text>
    <text y="510">  └─ <tspan class="dim">TaskController</tspan> <tspan class="bold white">545763</tspan></text>
    <text y="530">  └─ <tspan class="dim">IPC I/O Parent</tspan> <tspan class="bold white">545738</tspan></text>
    <text y="550" class="dim">  ...and 122 more</text>

    <!-- NETWORK -->
    <text y="586" class="blue">NETWORK</text>
    <text y="608">  → <tspan class="yellow">TCP 192.168.1.83:53736 -> 34.107.243.93:443 (ESTABLISHED)</tspan></text>
    <text y="628">  → <tspan class="yellow">TCP [2a0d:3341:...]:43816 -> [2606:4700:...]:443 (ESTABLISHED)</tspan></text>
    <text y="648">  → <tspan class="yellow">UDP [::]:43319</tspan></text>

    <!-- UNIX SOCKETS -->
    <text y="684" class="blue">UNIX SOCKETS (Top 5)</text>
    <text y="706">  → <tspan class="cyan">/run/user/1000/wayland-proxy-545719</tspan></text>
    <text y="726">  → <tspan class="cyan">[socket: 829325]</tspan></text>
    <text y="746">  → <tspan class="cyan">[unnamed SEQPACKET socket (inode 1004626)]</tspan></text>
    <text y="766">  → <tspan class="cyan">[unnamed SEQPACKET socket (inode 1056766)]</tspan></text>
    <text y="786" class="dim">  ...and 42 more</text>

    <!-- FILES -->
    <text y="822" class="blue">FILES (Top 5)</text>
    <text y="844">  /dev/dri/renderD128</text>
    <text y="864">  /dev/null</text>
    <text y="884">  /dev/tty1</text>
    <text y="904" class="dim">  ...and 57 more</text>
  </g>
</svg>
