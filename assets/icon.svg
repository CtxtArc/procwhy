<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="grad-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#39c5cf"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="256" height="256" rx="56" fill="url(#grad-bg)"/>
  <rect width="254" height="254" x="1" y="1" rx="55" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Subtitle Radar Rings (Diagnostics) -->
  <circle cx="128" cy="116" r="68" fill="none" stroke="#21262d" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="128" cy="116" r="44" fill="none" stroke="#21262d" stroke-width="1.5"/>

  <!-- Process Node Network & Inspection Lens -->
  <!-- Target Scope / Lens Ring -->
  <circle cx="120" cy="110" r="48" fill="none" stroke="url(#grad-stroke)" stroke-width="7" filter="url(#glow)"/>
  <circle cx="120" cy="110" r="48" fill="none" stroke="url(#grad-stroke)" stroke-width="6"/>

  <!-- Diagnostic Scan Beam / Why Question Mark Arc -->
  <path d="M 102 96 C 104 80, 136 78, 138 96 C 140 114, 120 118, 120 130" 
        fill="none" stroke="#f0f6fc" stroke-width="6" stroke-linecap="round"/>
  <circle cx="120" cy="144" r="3.5" fill="#3fb950"/>

  <!-- Handle of the Inspector Scope -->
  <path d="M 155 145 L 194 184" fill="none" stroke="url(#grad-accent)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 155 145 L 194 184" fill="none" stroke="#f0f6fc" stroke-width="7" stroke-linecap="round"/>

  <!-- Process Satellite Nodes -->
  <circle cx="70" cy="80" r="5" fill="#58a6ff"/>
  <line x1="75" y1="84" x2="88" y2="94" stroke="#58a6ff" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>

  <circle cx="180" cy="74" r="4.5" fill="#39c5cf"/>
  <line x1="175" y1="78" x2="160" y2="88" stroke="#39c5cf" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>

  <circle cx="64" cy="154" r="4" fill="#3fb950"/>
  <line x1="68" y1="150" x2="82" y2="138" stroke="#3fb950" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>
</svg>
